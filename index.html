<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Тексты</title>
<style>
:root{--bg:#f5f7f6;--card:#fff;--ink:#17242a;--muted:#5b6b70;--line:#d4dcda;--accent:#0e6a5a;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1719;--card:#162226;--ink:#e6eeec;--muted:#9db0b3;--line:#2b3c40;--accent:#4fc2a8;--bad:#ef6f66;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:24px 16px}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px;width:100%;max-width:380px;display:grid;gap:14px}
h1{font-size:22px;margin:0}p{margin:0;color:var(--muted);font-size:16px}
input[type=password]{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
input[type=password]:focus{outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent)}
label{display:flex;gap:10px;align-items:center;font-size:16px;color:var(--muted)}
button{font:inherit;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
.err{color:var(--bad);font-size:15px;min-height:1.2em}
</style></head><body>
<form id="f" autocomplete="on">
<h1>Тексты</h1><p>Введите пароль, чтобы открыть.</p>
<input id="pw" type="password" autocomplete="current-password" required>
<label><input id="rm" type="checkbox" checked> Запомнить на этом устройстве</label>
<button id="go" type="submit">Открыть</button><div class="err" id="err"></div>
</form>
